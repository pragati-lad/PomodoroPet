{% extends "base.html" %}

{% block title %}Login - PomoPet{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>Welcome Back!</h1>
        <p>Login to continue your study journey with your pet</p>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up here</a>
        </p>
    </div>
</div>
{% endblock %}
